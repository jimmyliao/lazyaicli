name: draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Draft version, for example v0.9.0
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like v0.9.0" >&2; exit 1 ;;
          esac

      - name: Test
        run: |
          CGO_ENABLED=0 go build -o dist/lazyai ./cmd/lazyai
          tests/cli_contract.sh
          tests/backend_flows.sh
          tests/install_binary.sh
          go test ./...
          go vet ./...

      - name: Build four self-contained binaries
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist/release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/release/lazyai-$os-$arch" ./cmd/lazyai
          done
          cd dist/release
          sha256sum lazyai-* > SHA256SUMS

      - name: Prepare release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed "s/{{VERSION}}/$VERSION/g" .github/release-draft.md > dist/release-notes.md

      - name: Create or update GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/release/* --clobber
            gh release edit "$VERSION" --draft --notes-file dist/release-notes.md
          else
            args=(release create "$VERSION" dist/release/* --draft --title "lazyai $VERSION" --notes-file dist/release-notes.md)
            [ "$PRERELEASE" = true ] && args+=(--prerelease)
            gh "${args[@]}"
          fi
