name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n lib/engine.sh bin/ccs bin/ags bin/cxs ccs.sh ags.sh cxs.sh install.sh tests/smoke.sh
      - name: Run adapter and installer smoke tests
        run: tests/smoke.sh
