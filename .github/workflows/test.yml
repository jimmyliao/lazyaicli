name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build self-contained CLI
        run: CGO_ENABLED=0 go build -o dist/lazyai ./cmd/lazyai
      - name: Run CLI contract
        run: tests/cli_contract.sh
      - name: Run all backend flows
        run: tests/backend_flows.sh
      - name: Run backend detection matrix
        run: tests/backend_detection.sh
      - name: Run edge cases
        run: tests/edge_cases.sh
      - name: Run binary installer tests
        run: tests/install_binary.sh
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  release-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Cross-compile release targets
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            suffix=""; [ "$os" = windows ] && suffix=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o "dist/lazyai-$os-$arch$suffix" ./cmd/lazyai
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lazyai-release-builds
          path: dist/lazyai-*

  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build Windows amd64 release candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags '-s -w -X main.version=v0.1.0-rc1' -o dist/lazyai-windows-amd64.exe ./cmd/lazyai
      - name: Run Go tests and Windows install contract
        shell: pwsh
        run: |
          go test ./...
          go vet ./...
          ./tests/windows_contract.ps1
